name: Update listings

on:
  push:
    branches: [main]
    paths:
      - "books/**"
      - "!books/**/index.html"
      - "blog/**"
      - "!blog/**/index.html"
      - "tips/**"
      - "!tips/**/index.html"
      - "projects/**"
      - "!projects/**/index.html"
      - "scripts/gen_listing.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-listing
  cancel-in-progress: false

jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate listing pages
        run: python3 scripts/gen_listing.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A books projects tips blog index.html feed.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update listings [skip ci]"
            git push
          fi
